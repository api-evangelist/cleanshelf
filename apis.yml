description: >-
  Cleanshelf was a San Francisco enterprise SaaS management platform that
  discovered and inventoried an organization's SaaS applications, optimized
  software licenses, tracked subscription spend, and surfaced shadow IT. At
  acquisition it claimed more than 3,000 integrations and managed roughly $700
  million in SaaS spend for its customers. LeanIX acquired Cleanshelf on 24
  March 2021 and relaunched the technology on 1 May 2021 as LeanIX SaaS
  Intelligence, with SaaS discovery and cataloging folded into the LeanIX
  Application Portfolio Management module; LeanIX itself was later acquired by
  SAP. Cleanshelf publishes no API, developer portal or documentation of its
  own today — cleanshelf.com 301-redirects to www.leanix.net and its former
  api, app and docs hostnames no longer resolve. The successor API surface is
  profiled separately under the LeanIX record.
