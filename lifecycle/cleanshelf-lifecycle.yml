source: >-
  LeanIX acquisition press release (24 March 2021), the LeanIX blog post
  announcing the product transition, and live probes of cleanshelf.com.
description: >-
  Lifecycle record for the Cleanshelf product and its API. Cleanshelf is
  end-of-life: the company was acquired and the product was folded into the
  acquirer's platform. There is no versioning policy, deprecation header
  policy, SLA or status page to record, because there is no running Cleanshelf
  service.
status: retired
retired: true
retirement:
  event: acquisition
  acquirer: LeanIX
  announced: '2021-03-24'
  announcement_url: https://www.leanix.net/en/company/press/leanix-acquire-saas-management-provider-cleanshelf
  successor_product: LeanIX SaaS Intelligence
  successor_available_from: '2021-05-01'
  successor_note: >-
    SaaS discovery and cataloging was also made available as a component of the
    LeanIX Application Portfolio Management module in Q2 2021. LeanIX was later
    acquired by SAP; the LeanIX API surface is profiled separately under the
    leanix record.
  successor_record: https://apis.io/providers/leanix/
